name: Deploy

# Manual only. This deploys the LIVE production stack — never wire it to push.
#
# It exists as the one-tap mobile deploy path: with Terraform state in S3 there
# is no state handoff, so a phone can run the same ./pipeline.sh the laptop runs.
#
# Prerequisites (not yet provisioned — see docs/TODO.md):
#   - an IAM role GitHub can assume via OIDC, scoped to what pipeline.sh calls
#   - repository secret AWS_DEPLOY_ROLE_ARN holding that role's full ARN
# Until both exist this workflow fails at the credentials step by design.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: What to deploy
        type: choice
        options: [all, backend-only, frontend-only]
        default: all
      mode:
        description: plan-only is a dry run (no deploy)
        type: choice
        options: [plan-only, deploy]
        default: plan-only
      confirm:
        description: Type "deploy-production" to allow mode=deploy
        type: string
        default: ""

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: 1.13.3 # keep in sync with scripts/cloud-setup.sh

# One deploy at a time. The S3 state lock would already reject a second writer;
# this just turns that into a queued run instead of a failed one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ inputs.mode }} (${{ inputs.scope }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC

    steps:
      - name: Require explicit confirmation for a real deploy
        if: inputs.mode == 'deploy' && inputs.confirm != 'deploy-production'
        run: |
          echo "mode=deploy needs confirm=deploy-production. Got: '${{ inputs.confirm }}'" >&2
          exit 1

      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false # pipeline.sh parses terraform output directly

      - name: Preflight
        run: ./scripts/deploy-preflight.sh

      # pipeline.sh resolves the S3 backend, migrates legacy local state if it
      # finds any, and refuses to apply when the state disagrees with AWS.
      - name: Run pipeline
        run: |
          ARGS=()
          case "${{ inputs.scope }}" in
            backend-only)  ARGS+=(--backend-only) ;;
            frontend-only) ARGS+=(--frontend-only) ;;
          esac
          [[ "${{ inputs.mode }}" == "plan-only" ]] && ARGS+=(--plan-only)
          ./pipeline.sh --env dev "${ARGS[@]}"
